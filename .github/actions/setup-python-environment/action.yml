name: Set up Python environment
description: Configure the repository Python version, pip cache, and Nox.

inputs:
  requirements-file:
    description: Requirement file containing the outer automation dependencies.
    required: false
    default: requirements-nox.txt

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: |
          .python-version
          requirements*.txt

    - name: Install automation dependencies
      shell: bash
      env:
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r "$REQUIREMENTS_FILE"
