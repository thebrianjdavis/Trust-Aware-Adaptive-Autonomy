name: Build & Deploy Doxygen to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # needed for actions/deploy-pages
  id-token: write   # needed for actions/deploy-pages

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Doxygen, Graphviz, and doxypypy
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install doxypypy

      # Verify the config
      - name: Show Doxygen version
        run: doxygen -v

      - name: Build documentation
        run: |
          # Ensure output directory exists and avoid Jekyll processing
          mkdir -p docs/build/html
          doxygen Doxyfile
          touch docs/build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        